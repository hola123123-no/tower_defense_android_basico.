
name: Compilar Tower Defense APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            pkg-config \
            build-essential \
            git \
            zip \
            unzip \
            gettext \
            autopoint \
            cmake \
            zlib1g-dev \
            libncurses-dev \
            libffi-dev \
            libssl-dev

      - name: Preparar herramientas de compilacion
        run: |
          libtoolize --version
          autoreconf --version
          python -m pip install --upgrade pip
          python -m pip install "buildozer==1.6.0" "Cython==0.29.37"

      - name: Compilar APK
        run: |
          buildozer -v android debug

      - name: Guardar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tower-defense-apk
          path: bin/*.apk
          if-no-files-found: error
